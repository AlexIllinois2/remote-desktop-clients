name: Release Build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Download prebuilt native dependencies
        run: |
          ./download-prebuilt-dependencies.sh
          ./bVNC/prepare_project.sh --skip-build libs nopath

      - name: Build Unsigned Release Apks
        run: ./gradlew assembleRelease --parallel --stacktrace

      - name: Organize the Files
        run: |
          mkdir -p apk
          find . -path '*/build/outputs/apk/*' -type f -name '*.apk' -exec cp -f {} apk/ \;
          ls -l apk/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: apk/*.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
